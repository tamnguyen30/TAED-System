name: Recover 13 missing held-out episodes
on:
  push:
    branches: [research/agentic-taed]
    paths: [.github/workflows/recover-placement-42532057933.yml]
permissions:
  contents: read
jobs:
  evaluation:
    name: recover ${{ matrix.task }} seed ${{ matrix.seed }} (${{ matrix.placement }})
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - {task: user_task_14, seed: 47, placement: clean, arm: all}
          - {task: user_task_14, seed: 47, placement: same, arm: all}
          - {task: user_task_14, seed: 47, placement: separate, arm: all}
          - {task: user_task_17, seed: 11, placement: separate, arm: filter_only}
    env:
      OPENAI_COMPATIBLE_API_KEY: ollama
      OPENAI_COMPATIBLE_BASE_URL: http://127.0.0.1:11434/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark
        run: python -m pip install 'agentdojo==0.1.35' 'openai==3.46.0'
      - name: Start local model server
        run: |
          mkdir -p results-pilot
          docker run -d --name ollama --publish 127.0.0.1:11434:11434 -e OLLAMA_CONTEXT_LENGTH=16384 ollama/ollama:0.12.11@sha256:3d8a05e3432d50ea57594fabe971e46cc8fe963a0f9f8c40400bd56cd5388e47
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:11434/api/version > results-pilot/server.json
          docker exec ollama ollama pull qwen3:8b
          curl -fsS http://127.0.0.1:11434/api/tags > results-pilot/models.json
      - name: Recover missing evaluation episodes
        env:
          PLACEMENT: ${{ matrix.placement }}
          ARM: ${{ matrix.arm }}
        run: |
          python - --phase evaluation --task ${{ matrix.task }} --seed ${{ matrix.seed }} --out results-pilot/episodes.jsonl <<'PY'
          import os
          from agentic_taed.v2 import heldout_placement as experiment

          # Restrict enumeration before constructing any agent or environment.
          experiment.PLACEMENTS = [os.environ["PLACEMENT"]]
          if os.environ["ARM"] != "all":
              experiment.ARMS = [os.environ["ARM"]]

          # The first original request expired three times at ten minutes.
          # Keep model and generation settings identical, allowing slower CPU hosts.
          original_live = experiment.live
          def recover(args, *inputs):
              args.timeout = 1200
              return original_live(args, *inputs)

          experiment.live = recover
          experiment.main()
          PY
      - name: Retain results and server diagnostics
        if: always()
        run: |
          mkdir -p results-pilot
          docker logs ollama > results-pilot/server.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-${{ matrix.task }}-seed-${{ matrix.seed }}-${{ matrix.placement }}-attempt-${{ github.run_attempt }}
          path: results-pilot/
          retention-days: 30
